[workspace]
channels = ["knime", "knime/label/nightly", "conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[tasks]

[dependencies]
python = "3.11.*"
knime-extension = "*"
knime-python-base = "5.10.*"
knime-python-versions = "5.10.*"
intervaltree = "*"
pydotplus = "*"
pip = "*"

[feature.build.dependencies]
python = "3.9.*"
knime-extension-bundling = "5.10.*"

[feature.debug.dependencies]
debugpy = "*"

[feature.build.tasks]
build = { args = [{ "arg" = "dest", "default" = "./local-update-site" }], cmd = "build-python-extension . {{ dest }} --update-sites-version 5.10"}


[environments]
build = {features = ["build"], no-default-feature = true}
debug = {features = ["debug"]}

[pypi-dependencies]
powl = "*"
pm4py = "*"

[pypi-options]
no-build = true