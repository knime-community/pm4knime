stages:
  - mirror

mirror-to-github-and-create-pr:
  stage: mirror
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: on_success
    - when: never
  variables:
    GIT_DEPTH: "0"
    GITHUB_REPO: "pm4knime/pm4knime"
  script: |
    set -e
    echo "Mirroring GitLab '$CI_COMMIT_REF_NAME' -> GitHub 'dev'..."
    git config user.name "fit-humam-kourani"
    git config user.email "humam.kourani@fit.fraunhofer.de"
    git fetch --unshallow || echo "Repo is already complete"
    git remote remove github 2>/dev/null || true
    git remote add github "https://${GITHUB_USERNAME}:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git"
    git push github "HEAD:refs/heads/dev"

    echo "Creating (or reusing) PR on GitHub: dev -> nightly"
    GITHUB_OWNER="${GITHUB_REPO%/*}"

    resp=$(curl -sS \
      -H "Authorization: Bearer ${GITHUB_TOKEN}" \
      -H "Accept: application/vnd.github+json" \
      "https://api.github.com/repos/${GITHUB_REPO}/pulls?state=open&head=${GITHUB_OWNER}:dev&base=nightly")

    if echo "$resp" | grep -q '"number":'; then
      echo "Open PR already exists dev -> nightly. Done."
      exit 0
    fi

    curl -sS -X POST \
      -H "Authorization: Bearer ${GITHUB_TOKEN}" \
      -H "Accept: application/vnd.github+json" \
      "https://api.github.com/repos/${GITHUB_REPO}/pulls" \
      -d "{
        \"title\": \"Merge dev into nightly\",
        \"head\": \"dev\",
        \"base\": \"nightly\",
        \"body\": \"Automated PR created by GitLab CI after mirroring to GitHub dev.\"
      }"

    echo "PR created successfully."
