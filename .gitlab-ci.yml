stages:
  - mirror
  - pr

variables:
  GIT_DEPTH: "0"
  GITHUB_REPO: "pm4knime/pm4knime"  

mirror-to-github-dev:
  stage: mirror
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: always
    - when: never
  script:
    - echo "Mirroring '$CI_COMMIT_REF_NAME' pipeline commit to GitHub branch 'dev'..."

    - git config user.name "fit-humam-kourani"
    - git config user.email "humam.kourani@fit.fraunhofer.de"

    - git fetch --unshallow || echo "Repo is already complete"

    - git remote remove github 2>/dev/null || true
    - git remote add github "https://${GITHUB_USERNAME}:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git"

    # push current HEAD to GitHub dev branch
    - git push github "HEAD:refs/heads/dev"

create-pr-dev-to-nightly:
  stage: pr
  needs: ["mirror-to-github-dev"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: always
    - when: never
  script:
    - echo "Creating (or reusing) PR dev -> nightly on GitHub..."

    # extract owner from GITHUB_REPO (owner/repo)
    - export GITHUB_OWNER="${GITHUB_REPO%/*}"

    # check if an open PR already exists from dev to nightly
    - |
      existing_pr=$(curl -s \
        -H "Authorization: token ${GITHUB_TOKEN}" \
        -H "Accept: application/vnd.github+json" \
        "https://api.github.com/repos/${GITHUB_REPO}/pulls?state=open&head=${GITHUB_OWNER}:dev&base=nightly" \
        | grep -m 1 '"number":' || true)

      if [ -n "$existing_pr" ]; then
        echo "PR already exists: $existing_pr"
        exit 0
      fi

    # create PR
    - |
      curl -s -X POST \
        -H "Authorization: token ${GITHUB_TOKEN}" \
        -H "Accept: application/vnd.github+json" \
        "https://api.github.com/repos/${GITHUB_REPO}/pulls" \
        -d "{
          \"title\": \"Merge dev into nightly\",
          \"head\": \"dev\",
          \"base\": \"nightly\",
          \"body\": \"Automated PR created by GitLab CI to sync dev -> nightly.\"
        }"
